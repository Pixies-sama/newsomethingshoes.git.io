<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Management | Control Panel</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* Structural Layout Variables Override */
      .dashboard-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      /* Top Row Stat Widgets Grid */
      .stats-summary-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-widget-card {
        background: #ffffff;
        border: 1px solid var(--border-light);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat-widget-card .lbl {
        font-size: 0.7rem;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.08em;
      }
      .stat-widget-card .val {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      /* Wide Inventory Table Block Layout */
      .inventory-section-wrapper {
        background: #ffffff;
        border: 1px solid var(--border-light);
        padding: 24px;
      }
      .section-header-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .inventory-table-container {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* Minimalist Row Item Styling - Desktop Default */
      .table-row-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
        border-bottom: 1px solid var(--border-light);
      }
      .table-row-item:last-child {
        border-bottom: none;
      }
      .row-meta-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .row-thumb {
        width: 60px;
        height: 60px;
        object-fit: contain;
        background: var(--bg-surface);
        border: 1px solid var(--border-light);
        flex-shrink: 0;
      }
      .row-actions-right {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .control-action-btn {
        background: transparent;
        border: 1px solid var(--border-light);
        padding: 8px 16px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        cursor: pointer;
        transition: var(--transition);
        letter-spacing: 0.05em;
      }
      .control-action-btn.clear {
        color: var(--text-muted);
      }
      .control-action-btn.clear:hover {
        border-color: var(--text-primary);
        color: var(--text-primary);
      }
      .control-action-btn.delete {
        color: #b91c1c;
        border-color: #fef2f2;
      }
      .control-action-btn.delete:hover {
        background: #fef2f2;
        border-color: #b91c1c;
      }

      .badge-spotlight {
        font-size: 0.62rem;
        background: var(--bg-surface);
        color: var(--accent-tan);
        padding: 2px 6px;
        font-weight: 700;
        margin-left: 8px;
        letter-spacing: 0.02em;
      }

      /* Minimalist Popup Modal Configuration Overlay */
      .popup-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(26, 20, 18, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 2000;
        padding: 20px;
      }
      .popup-modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-surface-box {
        background: #ffffff;
        width: 100%;
        max-width: 500px;
        padding: 32px;
        border: 1px solid var(--text-primary);
        position: relative;
      }
      .modal-close-trigger {
        position: absolute;
        top: 24px;
        right: 24px;
        background: transparent;
        border: none;
        font-size: 1.1rem;
        cursor: pointer;
        color: var(--text-muted);
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-weight: 700;
        font-size: 0.7rem;
        text-transform: uppercase;
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }

      /* ==================== RIGID MOBILE SPACING OVERHAUL ==================== */
      @media (max-width: 768px) {
        .dashboard-container {
          padding: 24px 16px;
        }
        .stats-summary-row {
          grid-template-columns: 1fr;
          gap: 12px;
          margin-bottom: 24px;
        }

        .section-header-actions {
          flex-direction: column;
          align-items: stretch;
          gap: 16px;
          margin-bottom: 20px;
        }
        .section-header-actions button {
          width: 100%;
          text-align: center;
        }

        /* Convert Row to a Spaced out Stacked Block Element */
        .table-row-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
          padding: 24px 0;
        }

        /* Let metadata and image take up maximum comfortable layout width */
        .row-meta-left {
          width: 100%;
          gap: 16px;
        }
        .row-thumb {
          width: 70px;
          height: 70px;
        } /* Blown up slightly so it doesn't look squished */

        /* Push tracking and controls down, create clean divider separation line */
        .row-actions-right {
          width: 100%;
          justify-content: space-between;
          border-top: 1px solid var(--border-light);
          padding-top: 16px;
          gap: 0;
        }

        /* Stack control buttons neatly so touch inputs are isolated */
        .row-actions-right div[style*="display: flex"] {
          gap: 12px !important;
        }
        .control-action-btn {
          padding: 10px 20px; /* Enhanced tap targets for mobile screens */
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 30px;
        "
      >
        <div>
          <h2
            id="time-greeting-hook"
            style="
              font-family: var(--serif-font);
              font-size: 1.5rem;
              text-transform: uppercase;
              font-weight: 500;
              letter-spacing: 0.05em;
            "
          >
            HELLO, ADMIN
          </h2>
          <p
            style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2px"
          >
            Studio Management Workspace Overview
          </p>
        </div>
        <div style="display: flex; gap: 12px">
          <a
            href="/"
            style="
              font-size: 0.72rem;
              text-decoration: none;
              color: var(--text-primary);
              border: 1px solid var(--text-primary);
              padding: 8px 16px;
              font-weight: 600;
              letter-spacing: 0.05em;
            "
            >LIVE SITE</a
          >
          <a
            href="/admin/logout"
            style="
              font-size: 0.72rem;
              text-decoration: none;
              color: #ffffff;
              background: var(--text-primary);
              padding: 8px 16px;
              font-weight: 600;
              letter-spacing: 0.05em;
            "
            >LOGOUT</a
          >
        </div>
      </div>

      <section class="stats-summary-row">
        <div class="stat-widget-card">
          <span class="lbl">Total Catalog Items</span>
          <span id="stat-count" class="val">0</span>
        </div>
        <div id="spotlight-metric-card" class="stat-widget-card">
          <span class="lbl">Spotlight Slots Occupied</span>
          <span id="stat-spotlight" class="val">0 / 10</span>
        </div>
        <div class="stat-widget-card">
          <span class="lbl">Total Whatsapp Inquiries</span>
          <span id="stat-clicks" class="val">0</span>
        </div>
      </section>

      <main class="inventory-section-wrapper">
        <div class="section-header-actions">
          <h3
            style="
              font-size: 0.85rem;
              text-transform: uppercase;
              letter-spacing: 0.1em;
              font-weight: 700;
            "
          >
            Active Inventory Records
          </h3>
          <button
            class="btn-primary"
            onclick="openUploadModal()"
            style="padding: 10px 20px; font-size: 0.72rem; border-radius: 0"
          >
            + UPLOAD NEW SILHOUETTE
          </button>
        </div>

        <div id="table-entries-hook" class="inventory-table-container"></div>
      </main>
    </div>

    <div id="upload-popup-modal" class="popup-modal-overlay">
      <div class="modal-surface-box">
        <button class="modal-close-trigger" onclick="closeUploadModal()">
          <i class="fas fa-times"></i>
        </button>
        <h3
          style="
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            font-weight: 700;
          "
        >
          Upload New Design
        </h3>

        <form id="modal-upload-form" enctype="multipart/form-data">
          <div class="form-group">
            <label>Product Model Name</label>
            <input
              type="text"
              name="name"
              class="form-input"
              required
              placeholder="e.g., Croco Patent Loafer"
            />
          </div>
          <div class="form-group">
            <label>Target Line / Category</label>
            <select name="gender" class="form-input">
              <option value="Men">MEN</option>
              <option value="Women">WOMEN</option>
              <option value="Unisex">UNISEX</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price Run Configuration (₦)</label>
            <input
              type="number"
              name="price"
              class="form-input"
              required
              placeholder="e.g., 85000"
            />
          </div>
          <div class="form-group">
            <label>Description Narrative</label>
            <textarea
              name="description"
              class="form-input"
              rows="3"
              required
              placeholder="Material details..."
            ></textarea>
          </div>
          <div class="form-group">
            <label>Technical Specs (One per line)</label>
            <textarea
              name="specs"
              class="form-input"
              rows="2"
              placeholder="Italian calfskin lining"
            ></textarea>
          </div>
          <div class="form-group">
            <label>Lookbook Media Attachments (Up to 5 images)</label>
            <input
              type="file"
              name="footwearImages"
              class="form-input"
              multiple
              accept="image/*"
              required
              style="padding: 6px"
            />
          </div>
          <button
            type="submit"
            class="btn-primary"
            style="width: 100%; border-radius: 0; margin-top: 10px"
          >
            COMMIT ASSET TO DATABASE
          </button>
        </form>
      </div>
    </div>

    <script {nonce}>
      const modalOverlay = document.getElementById("upload-popup-modal");
      const uploadForm = document.getElementById("modal-upload-form");
      const tableHook = document.getElementById("table-entries-hook");

      // Time-based Greeting Engine Rule Logic
      function applyTimeBasedGreeting() {
        const greetingElement = document.getElementById("time-greeting-hook");
        const currentHour = new Date().getHours();
        let greetingMessage = "GOOD EVENING, ADMIN";

        if (currentHour >= 5 && currentHour < 12) {
          greetingMessage = "GOOD MORNING, ADMIN";
        } else if (currentHour >= 12 && currentHour < 17) {
          greetingMessage = "GOOD AFTERNOON, ADMIN";
        }

        greetingElement.innerText = greetingMessage;
      }

      function openUploadModal() {
        modalOverlay.classList.add("active");
      }
      function closeUploadModal() {
        modalOverlay.classList.remove("active");
        uploadForm.reset();
      }

      // Async payload delivery execution routes
      uploadForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        const payloadData = new FormData(this);

        try {
          const response = await fetch("/api/products/upload", {
            method: "POST",
            body: payloadData,
          });
          const result = await response.json();
          if (result.success) {
            closeUploadModal();
            synchronizeLiveMetricsDataset();
          } else {
            alert("Rejection error: " + result.message);
          }
        } catch (err) {
          alert("Loss of terminal access routing pathways.");
        }
      });

      // Database matrix mapping engine loop
      async function synchronizeLiveMetricsDataset() {
        try {
          const response = await fetch("/api/products");
          const dataset = await response.json();

          document.getElementById("stat-count").innerText = dataset.length;
          document.getElementById("stat-spotlight").innerText =
            `${Math.min(dataset.length, 10)} / 10`;

          let cumulativeClicks = 0;

          if (dataset.length === 0) {
            tableHook.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.8rem; letter-spacing: 0.05em;">NO DESIGNS RECORDED IN CURRENT TABLES.</div>`;
            document.getElementById("stat-clicks").innerText = "0";
            return;
          }

          tableHook.innerHTML = dataset
            .map((item, index) => {
              cumulativeClicks += item.clicks || 0;
              const thumbUrl =
                item.imageUrls && item.imageUrls.length > 0
                  ? item.imageUrls[0]
                  : "/images/placeholder.png";
              const badgeStr =
                index < 10
                  ? `<span class="badge-spotlight">SPOTLIGHT ROW ${index + 1}</span>`
                  : "";

              return `
            <div class="table-row-item">
              <div class="row-meta-left">
                <img src="${thumbUrl}" class="row-thumb" alt="">
                <div>
                  <h4 style="font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;">${item.name} ${badgeStr}</h4>
                  <p style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;">Line: ${item.gender} &bull; ₦${Number(item.price).toLocaleString()} &bull; ${item.imageUrls ? item.imageUrls.length : 1} Images</p>
                </div>
              </div>
              
              <div class="row-actions-right">
                <div style="text-align: left; min-width: 60px;">
                  <span style="display: block; font-size: 1.2rem; font-weight: 700; line-height: 1.1;">${item.clicks || 0}</span>
                  <span style="display: block; font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); font-weight:600; letter-spacing: 0.05em; margin-top: 2px;">Inquiries</span>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="control-action-btn clear" onclick="clearRowClicks(${item.id})">Clear</button>
                  <button class="control-action-btn delete" onclick="deleteRowAsset(${item.id})">Delete</button>
                </div>
              </div>
            </div>
          `;
            })
            .join("");

          document.getElementById("stat-clicks").innerText = cumulativeClicks;
        } catch (err) {
          console.error("Layout redraw tracking exception occurred.", err);
        }
      }

      async function clearRowClicks(id) {
        if (!confirm("Reset inbound link metrics clicks back to zero?")) return;
        const res = await fetch(`/api/products/${id}/reset`, {
          method: "POST",
        });
        if (res.ok) synchronizeLiveMetricsDataset();
      }

      async function deleteRowAsset(id) {
        if (
          !confirm(
            "Permanently erase product model configuration parameters and files?",
          )
        )
          return;
        const res = await fetch(`/api/products/${id}`, { method: "DELETE" });
        if (res.ok) synchronizeLiveMetricsDataset();
      }

      // Initialize layout stack execution loops
      applyTimeBasedGreeting();
      synchronizeLiveMetricsDataset();
    </script>
  </body>
</html>
